[platformio]
default_envs = seeed_xiao_esp32c6
src_dir = .
build_cache_dir = .pio/build_cache

[env]
extra_scripts = pre:scripts/windows_response_files.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.maximum_size = 1966080
build_src_filter =
    -<*>
    +<XIAO_ESP32C6.ino>
    +<*.cpp>
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    mikalhart/TinyGPSPlus @ 1.0.3
    adafruit/Adafruit SSD1306 @ 2.5.9
    adafruit/Adafruit GFX Library @ 1.11.9

[env:seeed_xiao_esp32c6]
upload_protocol = esptool

[env:ota]
upload_protocol = espota
upload_port = 192.168.0.67
upload_flags =
    --port=3232
    --host_port=54240
